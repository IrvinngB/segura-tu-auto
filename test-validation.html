<!DOCTYPE html>
<html>
<head>
    <title>Test Validación Registro</title>
</head>
<body>
    <h2>Test de Validación</h2>
    <form id="testForm">
        <input id="firstName" placeholder="Nombre" value="Test">
        <input id="lastName" placeholder="Apellido" value="User">
        <input id="email" placeholder="Email" value="test@example.com">
        <input id="password" placeholder="Password" value="123456">
        <input id="confirmPassword" placeholder="Confirm Password" value="123456">
        <select id="role">
            <option value="agent">Agent</option>
            <option value="customer">Customer</option>
        </select>
        <input id="country" placeholder="País" value="México">
        <button id="submitBtn" type="button">Registro</button>
    </form>
    
    <div id="result"></div>

    <script>
        const formData = {
            firstName: "Test",
            lastName: "User", 
            email: "test@example.com",
            password: "123456",
            confirmPassword: "123456",
            role: "agent",
            country: "México"
        };

        function isFormValid() {
            const basicFieldsComplete =
                formData.firstName.trim() !== "" &&
                formData.lastName.trim() !== "" &&
                formData.email.trim() !== "" &&
                formData.password.trim() !== "" &&
                formData.confirmPassword.trim() !== "" &&
                formData.password === formData.confirmPassword &&
                formData.password.length >= 6;

            console.log("Validation check:", {
                firstName: formData.firstName.trim() !== "",
                lastName: formData.lastName.trim() !== "",
                email: formData.email.trim() !== "",
                password: formData.password.trim() !== "",
                confirmPassword: formData.confirmPassword.trim() !== "",
                passwordsMatch: formData.password === formData.confirmPassword,
                passwordLength: formData.password.length >= 6,
                basicComplete: basicFieldsComplete,
                role: formData.role
            });

            if (formData.role === "customer") {
                const customerFieldsComplete = formData.country.trim() !== "";
                return basicFieldsComplete && customerFieldsComplete;
            }

            return basicFieldsComplete;
        }

        function updateButton() {
            const btn = document.getElementById('submitBtn');
            const valid = isFormValid();
            btn.disabled = !valid;
            btn.style.backgroundColor = valid ? 'green' : 'gray';
            document.getElementById('result').innerHTML = `Form valid: ${valid}`;
        }

        // Test with agent role
        console.log("Testing with agent role:");
        updateButton();

        // Test with customer role
        setTimeout(() => {
            console.log("Testing with customer role:");
            formData.role = "customer";
            updateButton();
        }, 2000);
    </script>
</body>
</html>
