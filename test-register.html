<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Registro</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; margin-bottom: 5px; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Test de Registro - SeguraTuAuto</h1>
    
    <form id="registerForm">
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="test@example.com" required>
        </div>
        
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" id="password" value="test123456" required>
        </div>
        
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" id="firstName" value="Test" required>
        </div>
        
        <div class="form-group">
            <label>Apellido:</label>
            <input type="text" id="lastName" value="User" required>
        </div>
        
        <div class="form-group">
            <label>Teléfono:</label>
            <input type="text" id="phone" value="+52 55 1234 5678" required>
        </div>
        
        <div class="form-group">
            <label>Rol:</label>
            <select id="role">
                <option value="customer">Cliente</option>
                <option value="agent">Agente</option>
            </select>
        </div>
        
        <button type="submit">Registrar</button>
    </form>
    
    <div id="result"></div>
    <div id="logs" class="log"></div>

    <script>
        // Configuración de Supabase
        const supabaseUrl = 'https://sztuxibgvlwbykaopnqg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6dHV4aWJndmx3YnlrYW9wbnFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgxMjIwOTAsImV4cCI6MjA3MzY5ODA5MH0.FG8snw8YMe4HTW76uMuy_ghIJUho-Ltq96cDUNq0OgM';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        function log(message) {
            console.log(message);
            const logs = document.getElementById('logs');
            logs.innerHTML += message + '<br>';
        }
        
        function showResult(message, isError = false) {
            const result = document.getElementById('result');
            result.innerHTML = message;
            result.className = isError ? 'error' : 'success';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                phone: document.getElementById('phone').value,
                role: document.getElementById('role').value,
            };
            
            // Agregar timestamp único al email para evitar duplicados
            formData.email = `test_${Date.now()}@example.com`;
            
            log('Iniciando proceso de registro...');
            log('Datos del formulario: ' + JSON.stringify(formData));
            
            try {
                // Paso 1: Registro en Supabase Auth
                log('Paso 1: Registrando usuario en Supabase Auth...');
                
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: formData.email,
                    password: formData.password,
                    options: {
                        data: {
                            first_name: formData.firstName,
                            last_name: formData.lastName,
                            phone: formData.phone,
                            role: formData.role,
                        },
                    },
                });

                if (authError) {
                    log('❌ Error en auth.signUp: ' + JSON.stringify(authError));
                    showResult('Error de autenticación: ' + authError.message, true);
                    return;
                }

                if (!authData.user) {
                    log('❌ No se devolvió usuario de auth.signUp');
                    showResult('No se pudo crear el usuario', true);
                    return;
                }

                log('✅ Usuario creado en auth: ' + authData.user.id);
                log('Confirmación requerida: ' + (authData.user.email_confirmed_at ? 'No' : 'Sí'));

                // Paso 2: Insertar en tabla users
                log('Paso 2: Insertando en tabla users...');
                
                const { data: userData, error: userError } = await supabase
                    .from('users')
                    .insert({
                        id: authData.user.id,
                        email: formData.email,
                        first_name: formData.firstName,
                        last_name: formData.lastName,
                        phone: formData.phone,
                        role: formData.role,
                        password_hash: 'handled_by_supabase_auth',
                    })
                    .select();

                if (userError) {
                    log('❌ Error insertando usuario: ' + JSON.stringify(userError));
                    showResult('Error creando perfil: ' + userError.message, true);
                    return;
                }

                log('✅ Usuario insertado en tabla users: ' + JSON.stringify(userData));

                // Paso 3: Si es customer, crear perfil de cliente
                if (formData.role === 'customer') {
                    log('Paso 3: Creando perfil de cliente...');
                    
                    const { data: customerData, error: customerError } = await supabase
                        .from('customers')
                        .insert({
                            user_id: authData.user.id,
                            date_of_birth: '1990-01-01',
                            country: 'México',
                            driving_experience_years: 15,
                            has_accidents: false,
                            has_claims: false,
                        })
                        .select();

                    if (customerError) {
                        log('❌ Error creando cliente: ' + JSON.stringify(customerError));
                        showResult('Error creando perfil de cliente: ' + customerError.message, true);
                        return;
                    }

                    log('✅ Cliente creado: ' + JSON.stringify(customerData));
                }

                log('🎉 ¡Registro completado exitosamente!');
                showResult('¡Usuario registrado exitosamente!');

            } catch (error) {
                log('💥 Error inesperado: ' + error.message);
                showResult('Error inesperado: ' + error.message, true);
            }
        });
    </script>
</body>
</html>
